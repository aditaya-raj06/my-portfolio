<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="searchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f24"/>
      <stop offset="100%" stop-color="#080612"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#searchBg)"/>

  <!-- Neural Vector Embedding Field -->
  <g transform="translate(100, 60)">
    <rect width="600" height="380" rx="16" fill="#110d21" stroke="rgba(192, 132, 252, 0.25)" stroke-width="1.5"/>

    <!-- Header bar -->
    <text x="30" y="45" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">VECTOR_SIMILARITY_SPACE // COSINE</text>
    <text x="470" y="45" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">kNN: Top-5</text>

    <!-- Visual 2D Vector Projection -->
    <g transform="translate(40, 75)">
      <!-- Axes -->
      <line x1="20" y1="260" x2="500" y2="260" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <line x1="20" y1="20" x2="20" y2="260" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

      <!-- Cluster 1 (Documentation) -->
      <circle cx="120" cy="180" r="45" fill="rgba(99, 102, 241, 0.15)"/>
      <circle cx="100" cy="190" r="4" fill="#818cf8"/>
      <circle cx="130" cy="170" r="4" fill="#818cf8"/>
      <circle cx="115" cy="205" r="4" fill="#818cf8"/>
      <circle cx="140" cy="195" r="4" fill="#818cf8"/>
      <text x="120" y="240" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Docs Cluster</text>

      <!-- Cluster 2 (Code Snippets) -->
      <circle cx="380" cy="90" r="55" fill="rgba(236, 72, 153, 0.15)"/>
      <circle cx="360" cy="80" r="4" fill="#f472b6"/>
      <circle cx="400" cy="70" r="4" fill="#f472b6"/>
      <circle cx="370" cy="110" r="4" fill="#f472b6"/>
      <circle cx="395" cy="105" r="4" fill="#f472b6"/>
      <circle cx="410" cy="85" r="4" fill="#f472b6"/>
      <text x="380" y="165" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Code Embeddings</text>

      <!-- Query Vector Ray -->
      <line x1="20" y1="260" x2="260" y2="120" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="4,4"/>
      <circle cx="260" cy="120" r="8" fill="#00f2fe"/>
      <text x="280" y="115" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">Query: "async retry logic"</text>

      <!-- Nearest neighbor indicator -->
      <line x1="260" y1="120" x2="360" y2="80" stroke="#10b981" stroke-width="2"/>
      <text x="320" y="125" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">score: 0.94</text>
    </g>
  </g>
</svg>
