<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07131e"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#cloudBg)"/>

  <!-- Server Rack & Telemetry Grid -->
  <g transform="translate(100, 60)">
    <!-- Dashboard Container -->
    <rect width="600" height="380" rx="16" fill="#0c1929" stroke="rgba(6, 182, 212, 0.2)" stroke-width="1.5"/>

    <!-- Header -->
    <text x="30" y="45" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">TELEMETRY_PIPELINE // ACTIVE</text>
    <circle cx="560" cy="40" r="6" fill="#10b981"/>

    <!-- Realtime Metric Cards -->
    <g transform="translate(30, 70)">
      <rect width="165" height="90" rx="10" fill="#112238" stroke="rgba(255,255,255,0.06)"/>
      <text x="16" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">INGESTION RATE</text>
      <text x="16" y="65" fill="#00f2fe" font-family="'Outfit', sans-serif" font-size="24" font-weight="bold">1.2M/day</text>
    </g>

    <g transform="translate(215, 70)">
      <rect width="165" height="90" rx="10" fill="#112238" stroke="rgba(255,255,255,0.06)"/>
      <text x="16" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">P99 LATENCY</text>
      <text x="16" y="65" fill="#10b981" font-family="'Outfit', sans-serif" font-size="24" font-weight="bold">14.2 ms</text>
    </g>

    <g transform="translate(400, 70)">
      <rect width="170" height="90" rx="10" fill="#112238" stroke="rgba(255,255,255,0.06)"/>
      <text x="16" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">CLUSTER NODES</text>
      <text x="16" y="65" fill="#f59e0b" font-family="'Outfit', sans-serif" font-size="24" font-weight="bold">24 Running</text>
    </g>

    <!-- Realtime Log Stream / Histogram -->
    <g transform="translate(30, 185)">
      <rect width="540" height="165" rx="10" fill="#08111c" stroke="rgba(255,255,255,0.04)"/>
      <!-- Frequency Bars -->
      <rect x="25" y="100" width="18" height="40" rx="3" fill="#0284c7" opacity="0.7"/>
      <rect x="55" y="80" width="18" height="60" rx="3" fill="#0284c7" opacity="0.7"/>
      <rect x="85" y="45" width="18" height="95" rx="3" fill="#00f2fe"/>
      <rect x="115" y="70" width="18" height="70" rx="3" fill="#0284c7" opacity="0.7"/>
      <rect x="145" y="60" width="18" height="80" rx="3" fill="#0284c7" opacity="0.7"/>
      <rect x="175" y="90" width="18" height="50" rx="3" fill="#0284c7" opacity="0.7"/>
      <rect x="205" y="50" width="18" height="90" rx="3" fill="#00f2fe"/>
      <rect x="235" y="75" width="18" height="65" rx="3" fill="#0284c7" opacity="0.7"/>
      <rect x="265" y="40" width="18" height="100" rx="3" fill="#00f2fe"/>
      <rect x="295" y="65" width="18" height="75" rx="3" fill="#0284c7" opacity="0.7"/>
      <rect x="325" y="85" width="18" height="55" rx="3" fill="#0284c7" opacity="0.7"/>
      <rect x="355" y="30" width="18" height="110" rx="3" fill="#10b981"/>
      <rect x="385" y="70" width="18" height="70" rx="3" fill="#0284c7" opacity="0.7"/>
      <rect x="415" y="90" width="18" height="50" rx="3" fill="#0284c7" opacity="0.7"/>
      <rect x="445" y="60" width="18" height="80" rx="3" fill="#00f2fe"/>
      <rect x="475" y="80" width="18" height="60" rx="3" fill="#0284c7" opacity="0.7"/>

      <text x="25" y="28" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Real-time Telemetry Stream (2500 req/sec peak)</text>
    </g>
  </g>
</svg>
