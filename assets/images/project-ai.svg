<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1424"/>
      <stop offset="100%" stop-color="#070913"/>
    </linearGradient>
    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Ambient Glow Core -->
  <circle cx="400" cy="250" r="160" fill="url(#neonViolet)" opacity="0.15" filter="url(#glow)"/>
  <circle cx="480" cy="220" r="120" fill="url(#neonCyan)" opacity="0.2" filter="url(#glow)"/>

  <!-- Pipeline Nodes & Graph Architecture -->
  <g stroke="url(#neonCyan)" stroke-width="2" stroke-dasharray="6,6" opacity="0.6">
    <line x1="160" y1="250" x2="320" y2="190"/>
    <line x1="160" y1="250" x2="320" y2="310"/>
    <line x1="320" y1="190" x2="480" y2="250"/>
    <line x1="320" y1="310" x2="480" y2="250"/>
    <line x1="480" y1="250" x2="640" y2="250"/>
  </g>

  <!-- Central Processing Node -->
  <g transform="translate(480, 250)">
    <circle r="44" fill="#151b30" stroke="url(#neonViolet)" stroke-width="3" filter="url(#glow)"/>
    <circle r="36" fill="#1b2340"/>
    <path d="M-12,-12 L12,12 M-12,12 L12,-12 M-16,0 L16,0 M0,-16 L0,16" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Input Node -->
  <g transform="translate(160, 250)">
    <rect x="-35" y="-35" width="70" height="70" rx="16" fill="#151b30" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#06b6d4"/>
    <text x="0" y="55" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">INPUT_CHAIN</text>
  </g>

  <!-- Branch Node 1 -->
  <g transform="translate(320, 190)">
    <rect x="-30" y="-30" width="60" height="60" rx="14" fill="#151b30" stroke="url(#neonCyan)" stroke-width="2"/>
    <text x="0" y="5" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">LLM-1</text>
  </g>

  <!-- Branch Node 2 -->
  <g transform="translate(320, 310)">
    <rect x="-30" y="-30" width="60" height="60" rx="14" fill="#151b30" stroke="url(#neonViolet)" stroke-width="2"/>
    <text x="0" y="5" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">TOOL</text>
  </g>

  <!-- Output Node -->
  <g transform="translate(640, 250)">
    <rect x="-35" y="-35" width="70" height="70" rx="16" fill="#151b30" stroke="#10b981" stroke-width="2"/>
    <path d="M-10,0 L-2,8 L12,-6" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="0" y="55" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">DISPATCH_OK</text>
  </g>

  <!-- Metric Badge Overlay -->
  <g transform="translate(40, 40)">
    <rect width="200" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="22" cy="21" r="6" fill="#10b981"/>
    <text x="36" y="26" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Autonomous Agent Core</text>
  </g>
</svg>
